{% extends "base.html" %}

{% block title %}{{ _('Add User') }} - {{ app_setting.app_name }}{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="page-header-card">

        <div class="page-header-row">

            <div class="page-header-left">

                <div class="page-header-icon">
                    <i class="bi bi-person-plus"></i>
                </div>

                <div>
                    <h2 class="page-header-title">{{ _('Add User') }}</h2>
                </div>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST" style="--form-field-label-width: 110px;">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row">

                    <div class="col-md-6 mb-3 form-field-row">

                        <label class="form-label form-field-label">
                            {{ _('Username') }}
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3 form-field-row">

                        <label class="form-label form-field-label">
                            {{ _('Full Name') }}
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3 form-field-row">

                        <label class="form-label form-field-label">
                            {{ _('Password') }}
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3 form-field-row">

                        <label class="form-label form-field-label">
                            {{ _('Role') }}
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            {% for choice in role_choices %}
                            <option value="{{ choice }}">{{ choice }}</option>
                            {% endfor %}

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    {{ _('Save User') }}
                </button>

                <a
                    href="{{ url_for('main.users') }}"
                    class="btn btn-secondary"
                >
                    {{ _('Cancel') }}
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
