{% extends "base.html" %}

{% block title %}{{ _('Edit Department') }} - {{ app_setting.app_name }}{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="page-header-card">
        <div class="page-header-row">
            <div class="page-header-left">
                <div class="page-header-icon">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h4 class="page-header-title">{{ _('Edit Department') }}</h4>
                </div>
            </div>
            <div class="page-header-actions">
                <a href="{{ url_for('main.departments') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    {{ _('Back') }}
                </a>
            </div>
        </div>
    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST" style="--form-field-label-width: 130px;">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3 form-field-row">

                    <label class="form-label form-field-label">
                        {{ _('Department Name') }}
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ department.name }}"
                        required
                    >

                </div>

                <div class="mb-3 form-field-row" style="align-items: flex-start;">

                    <label class="form-label form-field-label" style="padding-top: 0.4rem;">
                        {{ _('Description') }}
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ department.description or "" }}</textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    {{ _('Save Changes') }}
                </button>

                <a
                    href="{{ url_for('main.departments') }}"
                    class="btn btn-secondary"
                >
                    {{ _('Cancel') }}
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
