{% extends "base.html" %}

{% block title %}{{ _('Edit Scrap Record') }} - {{ app_setting.app_name }}{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="page-header-card">

        <div class="page-header-row">

            <div class="page-header-left">

                <div class="page-header-icon">
                    <i class="bi bi-pencil-square"></i>
                </div>

                <div>
                    <h4 class="page-header-title">
                        {{ _('Edit Scrap Record') }}
                    </h4>
                </div>

            </div>

            <div class="page-header-actions">

                <a href="{{ url_for('main.scrap_list') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    {{ _('Back') }}
                </a>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST" style="--form-field-label-width: 160px;">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3 form-field-row">

                    <label class="form-label form-field-label">
                        {{ _('Scrap Type') }}
                    </label>

                    <select name="scrap_type" class="form-select">
                        <option value="besi_biasa" {% if record.scrap_type == 'besi_biasa' %}selected{% endif %}>{{ _('Besi Biasa') }}</option>
                        <option value="besi_lgs" {% if record.scrap_type == 'besi_lgs' %}selected{% endif %}>{{ _('Besi Baja Ringan / LGS') }}</option>
                    </select>

                </div>

                <div class="mb-3 form-field-row">

                    <label class="form-label form-field-label">
                        {{ _('Date') }}
                    </label>

                    <input
                        type="date"
                        name="recorded_date"
                        class="form-control"
                        value="{{ record.recorded_date.strftime('%Y-%m-%d') }}"
                        required
                    >

                </div>

                <div class="mb-3 form-field-row">

                    <label class="form-label form-field-label">
                        {{ _('Quantity') }}
                    </label>

                    <div class="input-group">

                        <input
                            type="number"
                            step="0.01"
                            min="0.01"
                            name="quantity"
                            class="form-control"
                            value="{{ record.quantity }}"
                            required
                        >

                        <select name="unit" class="form-select" style="max-width: 110px;">
                            <option value="kg" {% if record.unit == 'kg' %}selected{% endif %}>kg</option>
                            <option value="ton" {% if record.unit == 'ton' %}selected{% endif %}>ton</option>
                        </select>

                    </div>

                </div>

                <div class="mb-3 form-field-row" style="align-items: flex-start;">

                    <label class="form-label form-field-label" style="padding-top: 0.4rem;">
                        {{ _('Notes') }}
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                    >{{ record.notes or '' }}</textarea>

                </div>

                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                <a href="{{ url_for('main.scrap_list') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
