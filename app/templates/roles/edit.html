{% extends "base.html" %}

{% block title %}{{ _('Edit Role') }} - Asset Tracker{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="page-header-card">
        <div class="page-header-row">
            <div class="page-header-left">
                <div class="page-header-icon">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h2 class="page-header-title">{{ _('Edit Role') }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST" style="--form-field-label-width: 110px;">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3 form-field-row">
                    <label class="form-label form-field-label">{{ _('Role Name') }}</label>
                    <input type="text" name="name" class="form-control" value="{{ role.name }}" required>
                </div>

                <div class="mb-3 form-field-row" style="align-items: flex-start;">
                    <label class="form-label form-field-label" style="padding-top: 0.4rem;">{{ _('Description') }}</label>
                    <textarea name="description" class="form-control" rows="2">{{ role.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                <a href="{{ url_for('main.role_permissions', role_id=role.id) }}" class="btn btn-outline-primary">{{ _('Set Permissions') }}</a>
                <a href="{{ url_for('main.roles') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
